<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main>
      <h1>Expense Manager</h1>
      <p class="version">Version {{ version }}</p>

      <form id="new-expense">
        <input
          id="description"
          name="description"
          placeholder="Neue Ausgabe…"
          maxlength="200"
          required
          autocomplete="off"
        />
        <label class="currency-input">
          <span>CHF</span>
          <input
            id="amount"
            name="amount"
            type="number"
            step="0.01"
            min="0.01"
            placeholder="0.00"
            aria-label="Betrag in CHF"
            required
          />
        </label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Kategorie</option>
          {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
          {% endfor %}
        </select>
        <input id="date" name="date" type="date" required />
        <button type="submit" id="submit">Hinzufügen</button>
        <button type="button" id="cancel" class="secondary" hidden>Abbrechen</button>
      </form>

      <p id="error" class="error" hidden></p>

      <label class="filter">
        Anzeigen:
        <select id="filter">
          <option value="">Alle Kategorien</option>
          {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
          {% endfor %}
        </select>
      </label>
      <ul id="expenses"></ul>

      <section id="summary">
        <h2>Auswertung</h2>
        <label class="filter">
          Summen je:
          <select id="group-by">
            <option value="category">Kategorie</option>
            <option value="month">Monat</option>
            <option value="category_month">Kategorie und Monat</option>
          </select>
        </label>
        <table id="summary-table"></table>
      </section>
    </main>

    <script>
      const form = document.getElementById("new-expense");
      const errorBox = document.getElementById("error");
      const container = document.getElementById("expenses");

      // Datum standardmaessig auf heute setzen
      document.getElementById("date").valueAsDate = new Date();

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = !message;
      }

      const filter = document.getElementById("filter");
      const submitButton = document.getElementById("submit");
      const cancelButton = document.getElementById("cancel");

      // ID der Ausgabe, die gerade bearbeitet wird (null = neue Ausgabe)
      let editingId = null;

      function resetForm() {
        editingId = null;
        form.reset();
        document.getElementById("date").valueAsDate = new Date();
        submitButton.textContent = "Hinzufügen";
        cancelButton.hidden = true;
      }

      function startEdit(expense) {
        editingId = expense.id;
        showError("");
        form.elements.description.value = expense.description;
        form.elements.amount.value = expense.amount;
        form.elements.category.value = expense.category;
        form.elements.date.value = expense.date;
        submitButton.textContent = "Speichern";
        cancelButton.hidden = false;
        form.elements.description.focus();
      }

      async function deleteExpense(expense) {
        if (!confirm(`„${expense.description}“ wirklich löschen?`)) return;
        showError("");
        const res = await fetch(`/api/expense/${expense.id}`, { method: "DELETE" });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showError(body.error || `Löschen fehlgeschlagen (HTTP ${res.status})`);
        } else if (editingId === expense.id) {
          resetForm();
        }
        await refresh();
      }

      // "2026-10-06" -> "06.10.2026". Bewusst ohne new Date(), weil das den
      // String als UTC liest und je nach Zeitzone einen Tag verschieben kann.
      function formatDate(iso) {
        const [year, month, day] = iso.split("-");
        return `${day}.${month}.${year}`;
      }

      async function loadExpenses() {
        // Filter als Query-Parameter, z. B. /api/expense?category=Lebensmittel
        const params = new URLSearchParams();
        if (filter.value) params.set("category", filter.value);
        const res = await fetch(`/api/expense?${params}`);
        const expenses = await res.json();
        container.replaceChildren();

        if (expenses.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "Keine Ausgaben vorhanden.";
          container.append(empty);
          return;
        }

        // Die API liefert bereits nach Datum sortiert (neueste zuerst)
        for (const e of expenses) {
          const item = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = `${formatDate(e.date)} – ${e.description}`;
          const category = document.createElement("small");
          category.textContent = e.category;
          const amount = document.createElement("strong");
          amount.textContent = `${e.amount} CHF`;
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "Bearbeiten";
          editButton.addEventListener("click", () => startEdit(e));
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.textContent = "Löschen";
          deleteButton.addEventListener("click", () => deleteExpense(e));
          item.append(text, category, amount, editButton, deleteButton);
          container.append(item);
        }
      }

      const groupBy = document.getElementById("group-by");
      const summaryTable = document.getElementById("summary-table");

      // "2024-06" -> "06.2024"
      function formatMonth(month) {
        const [year, m] = month.split("-");
        return `${m}.${year}`;
      }

      function makeRow(cells, tag = "td") {
        const row = document.createElement("tr");
        for (const { text, right } of cells) {
          const cell = document.createElement(tag);
          cell.textContent = text;
          if (right) cell.className = "num";
          row.append(cell);
        }
        return row;
      }

      async function loadSummary() {
        const res = await fetch(`/api/summary?group_by=${groupBy.value}`);
        if (!res.ok) {
          summaryTable.replaceChildren();
          return;
        }
        const rows = await res.json();
        summaryTable.replaceChildren();

        const labels = {
          category: ["Kategorie"],
          month: ["Monat"],
          category_month: ["Kategorie", "Monat"],
        }[groupBy.value];
        const head = makeRow(
          [...labels.map((text) => ({ text })), { text: "Summe (CHF)", right: true }],
          "th",
        );
        summaryTable.append(head);

        if (rows.length === 0) {
          const empty = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = labels.length + 1;
          cell.className = "empty";
          cell.textContent = "Keine Ausgaben vorhanden.";
          empty.append(cell);
          summaryTable.append(empty);
          return;
        }

        for (const r of rows) {
          const cells = [];
          if (r.category !== undefined) cells.push({ text: r.category });
          if (r.month !== undefined) cells.push({ text: formatMonth(r.month) });
          cells.push({ text: r.total, right: true });
          summaryTable.append(makeRow(cells));
        }
      }

      // Liste und Auswertung gemeinsam aktualisieren
      async function refresh() {
        await Promise.all([loadExpenses(), loadSummary()]);
      }

      filter.addEventListener("change", loadExpenses);
      groupBy.addEventListener("change", loadSummary);
      cancelButton.addEventListener("click", () => {
        showError("");
        resetForm();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");

        const data = Object.fromEntries(new FormData(form));
        const url = editingId === null ? "/api/expense" : `/api/expense/${editingId}`;
        const res = await fetch(url, {
          method: editingId === null ? "POST" : "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showError(body.error || `Speichern fehlgeschlagen (HTTP ${res.status})`);
          return;
        }

        resetForm();
        await refresh();
      });

      refresh();
    </script>
  </body>
</html>
