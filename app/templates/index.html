<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main>
      <h1>Expense Manager</h1>
      <p class="version">Version {{ version }}</p>

      <form id="new-expense">
        <input
          id="description"
          name="description"
          placeholder="Neue Ausgabe…"
          maxlength="200"
          required
          autocomplete="off"
        />
        <label class="currency-input">
          <span>CHF</span>
          <input
            id="amount"
            name="amount"
            type="number"
            step="0.01"
            min="0.01"
            placeholder="0.00"
            aria-label="Betrag in CHF"
            required
          />
        </label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Kategorie</option>
          {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
          {% endfor %}
        </select>
        <input id="date" name="date" type="date" required />
        <button type="submit">Hinzufügen</button>
      </form>

      <p id="error" class="error" hidden></p>

      <label class="filter">
        Anzeigen:
        <select id="filter">
          <option value="">Alle Kategorien</option>
          {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
          {% endfor %}
        </select>
      </label>
      <ul id="expenses"></ul>
    </main>

    <script>
      const form = document.getElementById("new-expense");
      const errorBox = document.getElementById("error");
      const container = document.getElementById("expenses");

      // Datum standardmaessig auf heute setzen
      document.getElementById("date").valueAsDate = new Date();

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = !message;
      }

      const filter = document.getElementById("filter");

      // "2026-10-06" -> "06.10.2026". Bewusst ohne new Date(), weil das den
      // String als UTC liest und je nach Zeitzone einen Tag verschieben kann.
      function formatDate(iso) {
        const [year, month, day] = iso.split("-");
        return `${day}.${month}.${year}`;
      }

      async function loadExpenses() {
        // Filter als Query-Parameter, z. B. /api/expense?category=Lebensmittel
        const params = new URLSearchParams();
        if (filter.value) params.set("category", filter.value);
        const res = await fetch(`/api/expense?${params}`);
        const expenses = await res.json();
        container.replaceChildren();

        if (expenses.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "Keine Ausgaben vorhanden.";
          container.append(empty);
          return;
        }

        // Die API liefert bereits nach Datum sortiert (neueste zuerst)
        for (const e of expenses) {
          const item = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = `${formatDate(e.date)} – ${e.description}`;
          const category = document.createElement("small");
          category.textContent = e.category;
          const amount = document.createElement("strong");
          amount.textContent = `${e.amount} CHF`;
          item.append(text, category, amount);
          container.append(item);
        }
      }

      filter.addEventListener("change", loadExpenses);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");

        const data = Object.fromEntries(new FormData(form));
        const res = await fetch("/api/expense", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showError(body.error || `Speichern fehlgeschlagen (HTTP ${res.status})`);
          return;
        }

        form.reset();
        document.getElementById("date").valueAsDate = new Date();
        await loadExpenses();
      });

      loadExpenses();
    </script>
  </body>
</html>
